name: Deploy Diya App

on:
  push:
    branches: [ main ] # Change this to 'master' if that is your branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build & Push Backend
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build Backend JAR
        run: |
          cd backend
          # This line gives the 'robot' permission to run the wrapper on Linux
          chmod +x mvnw 
          ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/diyadigital-backend:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/diyadigital-backend:latest

      # 2. Build Frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd DiyaWholesalerDashboard
          npm install
          npm run build

      # 3. Transfer Frontend to GCP (Cleans old files automatically)
      - name: Transfer Frontend Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_IP_ADDRESS }}
          username: sumanthkumardara133
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: "DiyaWholesalerDashboard/dist/*"
          target: "/home/sumanthkumardara133/site/public"
          strip_components: 2

      # 4. Refresh Services on GCP
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_IP_ADDRESS }}
          username: sumanthkumardara133
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd ~/site
            # This pulls the new :latest image we just pushed
            docker compose pull backend
            # This restarts the containers with the new code
            docker compose up -d